# Render Blueprint: Salgados Borges (web + Neon Postgres)
# https://render.com/docs/blueprint-spec
#
# Banco: use Neon (DATABASE_URL no painel do Render).
# Build: instala devDependencies (Vite/Nitro/Lovable) antes do build.

services:
  - type: web
    name: salgados-borges
    runtime: node
    plan: free
    region: oregon
    buildCommand: NPM_CONFIG_PRODUCTION=false npm ci && npm run build
    startCommand: npm run start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: "0.0.0.0"
      - key: DATABASE_URL
        sync: false
      - key: CMS_ADMIN_PASSWORD
        sync: false
      - key: CMS_SESSION_SECRET
        generateValue: true
